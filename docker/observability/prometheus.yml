# What Prometheus asks, and of whom. One app, so one job: the metrics the actuator serves on the
# management port (8081), which nothing publishes to the host — the containers' network is the
# boundary there, the same one the database is behind.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: gigsynchub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  # Prometheus itself: so "is anything being scraped at all" has an answer that does not depend on
  # the thing being scraped.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
