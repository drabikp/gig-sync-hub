# Tests use PostgreSQL in Docker (Testcontainers' jdbc:tc: URL — one container per test run).
# The schema comes from the Flyway migrations, so they are exercised by every test run.
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///gigsynchub?TC_DAEMON=true
# as in production: the app's connections under row-level security, the migrations as the owner
spring.datasource.hikari.connection-init-sql=set role gigsynchub_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=test
spring.flyway.password=test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Never load a developer's private band profile in tests.
gigsynchub.calendar.profile-file=
# Platform tasks are queued but never run in tests (no browser, no worker thread).
gigsynchub.sync.worker.enabled=false
# The nightly platform check never runs in tests (it would read the platforms).
gigsynchub.check.enabled=false
# a made-up Rauthy: the tests sign in with Spring Security's OIDC test support, nothing calls it
gigsynchub.auth.issuer=https://auth.test/auth/v1/
gigsynchub.auth.client-secret=test-only
# a JSON body may leave out a yes/no (it is then no)
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Behind the proxy (compose profile "proxy"): its X-Forwarded-* say the request came in over
# HTTPS (cookies are then Secure) — believed only from private addresses (Tomcat's own check).
server.forward-headers-strategy=native
# band #1 is claimed by this sign-in (the tests' "owner"), whichever test signs in first
gigsynchub.accounts.first-owner-email=owner@band.test
# a made-up data key (never a real one), so the bands' accounts can be kept in tests
gigsynchub.accounts.data-keys=test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# The same batching and id settings as production (see app/src/main/resources/application.properties),
# so the tests exercise how the app really writes rather than a row at a time.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
gigsynchub.housekeeping.enabled=false
