# Tests use PostgreSQL in Docker (Testcontainers' jdbc:tc: URL — one container per test run).
# The schema comes from the Flyway migrations, so they are exercised by every test run.
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///bzscraper?TC_DAEMON=true
# as in production: the app's connections under row-level security, the migrations as the owner
spring.datasource.hikari.connection-init-sql=set role bzscraper_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=test
spring.flyway.password=test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Never load a developer's private band profile in tests.
bzscraper.calendar.profile-file=
# Platform tasks are queued but never run in tests (no browser, no worker thread).
bzscraper.sync.worker.enabled=false
# The nightly platform check never runs in tests (it would read the platforms).
bzscraper.check.enabled=false
# a made-up Rauthy: the tests sign in with Spring Security's OIDC test support, nothing calls it
bzscraper.auth.issuer=https://auth.test/auth/v1/
bzscraper.auth.client-secret=test-only
# a JSON body may leave out a yes/no (it is then no)
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Behind the proxy (compose profile "proxy"): its X-Forwarded-* say the request came in over
# HTTPS (cookies are then Secure) — believed only from private addresses (Tomcat's own check).
server.forward-headers-strategy=native
# band #1 is claimed by this sign-in (the tests' "owner"), whichever test signs in first
bzscraper.accounts.first-owner-email=owner@band.test
# a made-up data key (never a real one), so the bands' accounts can be kept in tests
bzscraper.accounts.data-keys=test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
