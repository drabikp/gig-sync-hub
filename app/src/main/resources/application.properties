# PostgreSQL — the source of truth for gigs. In Docker (compose.yaml) the address and the
# password come from the container's settings and secrets; outside it, a local PostgreSQL
# (e.g. `docker compose up -d db`, which listens on localhost:5432) with
# SPRING_DATASOURCE_PASSWORD set. Only one app may use a database: a second instance would
# run a second sync worker over the same tasks.
spring.datasource.url=jdbc:postgresql://localhost:5432/gigsynchub
spring.datasource.username=gigsynchub
spring.jpa.open-in-view=false
# Row-level security (migration V6): the app's connections work as gigsynchub_app, which the policies hold to
# the band a request is about; the migrations run on a connection of their own, as the tables' owner.
spring.datasource.hikari.connection-init-sql=set role gigsynchub_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password:}

# The schema is owned by Flyway (features/gig/src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# How the app talks to the database, rather than what it asks (High-Performance Java Persistence):
#   batch_size + order_inserts/updates — the rows of one transaction go in a handful of round trips
#     instead of one each; the ids come from sequences (V9) because an identity column cannot batch.
#   batch_versioned_data — true because PostgreSQL reports per-statement row counts, so an optimistic
#     lock (gig.version, sync_task.version) is still caught inside a batch.
#   pooled-lo — a sequence block is read as its FIRST id, so the ids a block hands out are above the
#     value the database gave, never below it.
#   in_clause_parameter_padding — an "in (…)" of 3 or 7 ids is padded to 4 or 8, so a handful of SQL
#     shapes serve every page instead of one per list length, and the plan caches keep them.
#   plan_cache — how many of those shapes Hibernate keeps compiled; a miss is a re-parse on the
#     request's own time.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# One-time move from the H2 database: an H2 SQL backup (SCRIPT) to copy into an EMPTY database
# right after the schema is built; skipped when the database has data.
# gigsynchub.db.import-h2=./data/backups/gigsynchub-2026-10-09.sql

# Many bands on one server (multi-band plan, phase 3); the defaults:
# gigsynchub.sync.worker.threads=2                      lanes (a band's work on a platform) run at once, the bands in turn
# gigsynchub.sync.breaker.failures=3                    a band's batches failing in a row on a platform hold it back…
# gigsynchub.sync.breaker.cooldown-minutes=30           …this long
# gigsynchub.sync.breaker.platform-bands=3              so many bands held back on a platform at once hold it back for all

# The operator's endpoints (health, metrics) on their own port, this machine only — never through the
# proxy, never to the bands: docker compose exec app curl -s localhost:8081/actuator/metrics/gigsynchub.sync.tasks
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics

# Secrets as files (Docker secrets): /run/secrets/<property name>, e.g.
# /run/secrets/spring.datasource.password. Absent outside Docker.
spring.config.import=optional:configtree:/run/secrets/

# Band calendars (read-only): each band connects its own on the page (its address kept encrypted).
# zone = the default for a new one; rules = classpath:calendar/*.profile + each band's own (edited on the
# page). ical-url and profile-file are band #1's from before that — kept once on start, then unused.
gigsynchub.calendar.ical-url=
gigsynchub.calendar.zone=Europe/Prague
gigsynchub.calendar.presets=sk-cz
gigsynchub.calendar.profile-file=./data/calendar-profile.txt

# --- Bands: the first band is the one the app ran for before it knew bands (migration V2); its
# address and name come from its Bandzone slug and Bandsintown artist the first time, its owner is
# whoever signs in with first-owner-email first (empty = whoever signs in first) ---
gigsynchub.accounts.first-band-slug=${gigsynchub.bandzone.band-slug:}
gigsynchub.accounts.first-band-name=${gigsynchub.bandsintown.artist-name:}
# gigsynchub.accounts.first-owner-email=
# The keys the bands' secrets (platform passwords, calendar addresses) are sealed with: id:base64 (32
# bytes) per line, the first active — NEVER in source (compose: the secret data_keys, made by
# docker/make-secrets.sh). Without one, no platform account or calendar can be kept.
# gigsynchub.accounts.data-keys=

# --- Signing in: through Rauthy (OIDC); who may sign in is Rauthy's, which bands one sees the memberships' ---
# gigsynchub.auth.issuer=https://localhost/auth/v1/    Rauthy as the browser reaches it (compose: from GSH_DOMAIN)
# gigsynchub.auth.internal-url=                       Rauthy inside the network (compose: http://rauthy:8080/auth/v1/)
# gigsynchub.auth.client-id=gigsynchub
# gigsynchub.auth.client-secret=                      NEVER in source (compose: the secret auth_client_secret)
# Behind the proxy (compose service "proxy"): its X-Forwarded-* say the request came in over
# HTTPS (cookies are then Secure) — believed only from private addresses (Tomcat's own check).
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
# the page's files are built by web/frontend; long cache for hashed assets, index.html always fresh
spring.web.resources.cache.cachecontrol.max-age=0
# a JSON body may leave out a yes/no (it is then no)
spring.jackson.deserialization.fail-on-null-for-primitives=false
