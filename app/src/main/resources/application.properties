# PostgreSQL — the source of truth for gigs. In Docker (compose.yaml) the address and the
# password come from the container's settings and secrets; outside it, a local PostgreSQL
# (e.g. `docker compose up -d db`, which listens on localhost:5432) with
# SPRING_DATASOURCE_PASSWORD set. Only one app may use a database: a second instance would
# run a second sync worker over the same tasks.
spring.datasource.url=jdbc:postgresql://localhost:5432/gigsynchub
spring.datasource.username=gigsynchub
spring.jpa.open-in-view=false
# The app's connections work as gigsynchub_app, which may not alter a table nor read
# flyway_schema_history; the migrations run on a connection of their own, as the tables' owner.
# (The role came with the row-level security of V6 and outlived it — V12 dropped every policy, and
# tenant isolation is the queries' own, kept that way at build time by BandScopedQueriesTest.)
spring.datasource.hikari.connection-init-sql=set role gigsynchub_app
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password:}
# A migration that cannot get its lock FAILS rather than waiting for ever. An `alter table` queues
# behind any open transaction and then everything else queues behind the alter — so a start that
# hits one long query does not merely take longer, it stops the database being usable while it
# waits. Fifteen seconds is far more than a migration against a healthy database needs, and a
# start that fails because something else was holding a table is a start worth looking at.
spring.flyway.init-sqls=set lock_timeout = '15s'

# The schema is owned by Flyway (features/gig/src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# How the app talks to the database, rather than what it asks (High-Performance Java Persistence):
#   batch_size + order_inserts/updates — the rows of one transaction go in a handful of round trips
#     instead of one each; the ids come from sequences (V9) because an identity column cannot batch.
#   batch_versioned_data — true because PostgreSQL reports per-statement row counts, so an optimistic
#     lock (gig.version, sync_task.version) is still caught inside a batch.
#   pooled-lo — a sequence block is read as its FIRST id, so the ids a block hands out are above the
#     value the database gave, never below it.
#   in_clause_parameter_padding — an "in (…)" of 3 or 7 ids is padded to 4 or 8, so a handful of SQL
#     shapes serve every page instead of one per list length, and the plan caches keep them.
#   plan_cache — how many of those shapes Hibernate keeps compiled; a miss is a re-parse on the
#     request's own time.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# One-time move from the H2 database: an H2 SQL backup (SCRIPT) to copy into an EMPTY database
# right after the schema is built; skipped when the database has data.
# gigsynchub.db.import-h2=./data/backups/gigsynchub-2026-10-09.sql

# Many bands on one server (multi-band plan, phase 3); the defaults:
# gigsynchub.sync.worker.threads=2                      lanes (a band's work on a platform) run at once, the bands in turn
# gigsynchub.sync.breaker.failures=3                    a band's batches failing in a row on a platform hold it back…
# gigsynchub.sync.breaker.cooldown-minutes=30           …this long
# gigsynchub.sync.breaker.platform-bands=3              so many bands held back on a platform at once hold it back for all

# --- What the operator can see: metrics, traces and logs ---
# The operator's endpoints on their own port — never through the proxy, never to the bands.
# Outside Docker it binds to this machine only; compose overrides the address, because the thing
# that scrapes it (Prometheus) is another container and nothing publishes 8081 to the host, so the
# containers' network is the boundary there, the same one the database is behind.
#   docker compose exec app curl -s localhost:8081/actuator/metrics/gigsynchub.sync.tasks
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics,prometheus,info
# liveness (the JVM is alive) and readiness (it can serve: the database answers) as their own
# endpoints, so an orchestrator can tell "restart me" from "don't send me traffic yet"
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# every metric, trace and log line of this app says which app it is — the one tag that makes a
# dashboard still read correctly the day something else writes to the same place
management.observations.key-values.application=gigsynchub

# TRACES. Spring Boot observes what it owns (every HTTP request, every scheduled run); what the app
# adds by hand is the call to a platform (PortalCall) and the sync run that makes it, which is where
# this app actually spends its time and which no framework can see — the JDK's HttpClient is nobody's
# to instrument and a worker thread is not a request.
#
# A span per SQL statement is deliberately NOT here. datasource-micrometer would give one, but it is
# built against Spring Boot 3 and its autoconfiguration does not load on 4
# (NoClassDefFoundError: .actuate.autoconfigure.observation.ObservationRegistryCustomizer, a class
# Boot 4 moved); wiring the proxy DataSource by hand instead would put a wrapper under Flyway,
# Hibernate and the pool's own `set role` for a signal this app already has two better sources for —
# the statement COUNTS are asserted at build time (GigListCostsTest, CountingOpenWorkCostsTest) and
# the slow ones name themselves below. When that library ships Boot 4 support it is one dependency.

# A statement slower than this says so, with its SQL and no parameter values, in a line that carries
# the trace id — so in Grafana the slow request leads to the trace and the trace to the statement.
# This is Hibernate's own, which means no proxy in the data path to get it.
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${GSH_SLOW_QUERY_MS:500}
#
# Sampling is 1.0 because this is one band's server, not a fleet: a few hundred requests an hour,
# and the trace you want is always the one that already happened. The ids are in every log line
# whether or not anything collects them, which is most of the value — `docker compose logs app |
# grep <traceId>` is a request's whole story and needs no stack at all.
management.tracing.sampling.probability=${GSH_TRACE_SAMPLING:1.0}
# Sent only when there is somewhere to send them. Off, the spans are still made and still named in
# the logs; on, they go to Tempo (compose's observability profile) or anything else that takes OTLP.
management.otlp.tracing.export.enabled=${GSH_OTLP_ENABLED:false}
management.otlp.tracing.endpoint=${GSH_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

# LOGS, twice over and on purpose. The console stays the readable line a person wants from
# `docker compose logs`; the file is the same events as JSON (ECS), which is what a log collector
# can index and join to a trace. Rolled and capped, because a log that fills the disk stops the
# database — the same reason the containers' own logs are capped in compose.
logging.file.name=${GSH_LOG_FILE:./data/logs/gigsynchub.json}
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=200MB

# Reading the SQL itself is a DEVELOPMENT thing and stays off. The parameters are the bands' data —
# gig titles, venues, members' addresses — and a log of every statement with its real values is a
# copy of the database in a file with a rotation policy. In a trace a statement is a span with its
# timing and no values, which answers "which query, how long" without keeping any of it.
#   logging.level.org.hibernate.SQL=DEBUG
#   logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Secrets as files (Docker secrets): /run/secrets/<property name>, e.g.
# /run/secrets/spring.datasource.password. Absent outside Docker.
spring.config.import=optional:configtree:/run/secrets/

# Band calendars (read-only): each band connects its own on the page (its address kept encrypted).
# zone = the default for a new one; rules = classpath:calendar/*.profile + each band's own (edited on the
# page). ical-url and profile-file are band #1's from before that — kept once on start, then unused.
gigsynchub.calendar.ical-url=
gigsynchub.calendar.zone=Europe/Prague
gigsynchub.calendar.presets=sk-cz
gigsynchub.calendar.profile-file=./data/calendar-profile.txt

# --- Bands: the first band is the one the app ran for before it knew bands (migration V2); its
# address and name come from its Bandzone slug and Bandsintown artist the first time, its owner is
# whoever signs in with first-owner-email first (empty = whoever signs in first) ---
gigsynchub.accounts.first-band-slug=${gigsynchub.bandzone.band-slug:}
gigsynchub.accounts.first-band-name=${gigsynchub.bandsintown.artist-name:}
# gigsynchub.accounts.first-owner-email=
# The keys the bands' secrets (platform passwords, calendar addresses) are sealed with: id:base64 (32
# bytes) per line, the first active — NEVER in source (compose: the secret data_keys, made by
# docker/make-secrets.sh). Without one, no platform account or calendar can be kept.
# gigsynchub.accounts.data-keys=

# --- Signing in: through Rauthy (OIDC); who may sign in is Rauthy's, which bands one sees the memberships' ---
# gigsynchub.auth.issuer=https://localhost/auth/v1/    Rauthy as the browser reaches it (compose: from GSH_DOMAIN)
# gigsynchub.auth.internal-url=                       Rauthy inside the network (compose: http://rauthy:8080/auth/v1/)
# gigsynchub.auth.client-id=gigsynchub
# gigsynchub.auth.client-secret=                      NEVER in source (compose: the secret auth_client_secret)
# Behind the proxy (compose service "proxy"): its X-Forwarded-* say the request came in over
# HTTPS (cookies are then Secure) — believed only from private addresses (Tomcat's own check).
server.forward-headers-strategy=native
# Stopping finishes what is in flight rather than cutting it off: the request a person is waiting
# for, and — the reason this matters here — a sync step halfway through talking to a platform. A
# step that IS cut off is postponed and runs again, which is right for an edit and uncomfortable
# for a create (it may already have made the event there). compose gives the container 45 s to use
# this (stop_grace_period), which is longer than the 20 s below so the JVM, not Docker, decides.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.servlet.session.cookie.same-site=lax
# Two different lengths, and the app needs both (SessionLife): this one is IDLE time — a page that
# keeps asking (the live updates reconnect on their own) holds a session open for ever — and
# session-max-age is the whole life of one, counted from when it was made.
server.servlet.session.timeout=12h
# gigsynchub.auth.session-max-age=12h    a session's whole life, however busy it has been
# gigsynchub.auth.revalidate-every=5m    how soon the app notices a sign-in Rauthy has ended
# gigsynchub.auth.group-prefix=          the group one must still be in (default: the client's id)
# The background work a REQUEST starts (reading a platform for Import, the platform check on
# demand): bounded, because each of these is a band driving a platform over the network and the
# default pool queues whatever arrives, for ever. Eight at a time and fifty waiting is far above
# what a page of users can ask for; past that the answer is 429 and "try again in a minute", which
# is the truth, rather than a queue nobody is watching (ApiErrors maps the rejection).
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=background-

# the page's files are built by web/frontend; long cache for hashed assets, index.html always fresh
spring.web.resources.cache.cachecontrol.max-age=0
# a JSON body may leave out a yes/no (it is then no)
spring.jackson.deserialization.fail-on-null-for-primitives=false
