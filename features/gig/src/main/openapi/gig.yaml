openapi: 3.0.3
info:
  title: gigsynchub — shared parts
  version: "1"
  description: |
    What every part of the API shares: a gig as the form holds it (GigFormRequest when sent,
    GigFormResponse when answered — the same fields), its country and entry type, and how the
    API says no. The features' specs refer to these schemas; the kernel generates them once
    (sk.drabikp.gigsynchub.gig.api) and the features use those classes. Names: …Request for what
    is sent, …Response for what is answered, …Value for an enum.
paths: {}
components:
  parameters:
    BandId:
      name: bandId
      in: path
      required: true
      description: The band (its id). A band the signed-in user doesn't manage is "not found" (404).
      schema:
        type: string
        format: uuid
  responses:
    Refused:
      description: A rule said no — nothing changed. The page says it from `code` and `args`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    BadRequest:
      description: The request makes no sense (a body that can't be read, a gig or platform that isn't one).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    NotFound:
      description: Nothing there (e.g. a gig deleted meanwhile).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
  schemas:
    ProblemCodeValue:
      description: |
        Every case the API says no with — each feature's own (the server's `<Feature>ErrorCode` enums,
        checked against this list by the app's tests; the page translates every one, `errors.<code>`).
        Kernel: changedMeanwhile, deletedMeanwhile, invalidGig (args.fields), notFound, badRequest,
        notConfigured (args.setting). Catalog: gigBusy (args.gig), gigIdentityTaken (args.date, venue).
        Sync: taskMovedOn (args.gig, status). Import: noPlatform, noPlan, nothingSelected, importReading.
        Calendar: calendarUnavailable, invalidCalendar (args.fields: address, zone), invalidRule
        (args.rule: its number, args.reason). Accounts: slugTaken (args.slug), invalidBand (args.fields:
        name, slug), ownerOnly, invalidAccount (args.fields), platformSignInFailed (args.platform, args.problem), secretsUnavailable, invalidEmail (args.email),
        alreadyMember (args.email), invitationGone, invitationNotForYou (args.email), lastOwner, confirmDelete
        (args.slug), tooManyBands (args.max). The app: tooManyRequests (args.seconds), unexpected.
      type: string
      enum: [changedMeanwhile, deletedMeanwhile, invalidGig, notFound, badRequest, notConfigured,
             gigBusy, gigIdentityTaken, taskMovedOn, noPlatform, noPlan, nothingSelected, importReading,
             calendarUnavailable, invalidCalendar, invalidRule, slugTaken, invalidBand, ownerOnly,
             invalidAccount, platformSignInFailed, secretsUnavailable, invalidEmail, alreadyMember, invitationGone,
             invitationNotForYou, lastOwner, confirmDelete, tooManyBands, tooManyRequests, unexpected]
    ProblemResponse:
      description: |
        How the API says no: `code` names the case (ProblemCodeValue), `args` its details; `message` is
        the English fallback.
      type: object
      required: [code, args, message]
      properties:
        code:
          $ref: '#/components/schemas/ProblemCodeValue'
        args:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
          nullable: true
    CountryValue:
      type: string
      enum: [CZECHIA, SLOVAKIA]
    EntryTypeValue:
      type: string
      enum: [FREE, VOLUNTARY, PAID]
    # A gig as the form holds it — one definition, sent both ways under two names (&gigForm).
    GigFormRequest: &gigForm
      description: |
        A gig as the form holds it: days and times as the band reads them in the gig's own
        country. Times are "HH:mm" (or "HH:mm:ss"). The town's address details come from the
        place search.

        Every length here is the one its COLUMN holds (V1__schema.sql, table `gig`), so what the
        API refuses and what the database would refuse are the same number: a title of 256
        characters is a 400 saying so, not a 500 from a constraint deep in a flush. The lineup is
        kept as one `varchar(2000)`, a band per line, so its bound is a pair — 20 bands of 99
        characters with their 19 newlines is 1999.
      type: object
      required: [title, date, time, endDate, endTime, slotDate, slotTime, slotEndTime, venue, city, country,
                 street, postalCode, district, region, latitude, longitude, lineup, entry, price,
                 description, facebookUrl, ticketUrl, posterUrl, cancelled]
      properties:
        title:
          type: string
          maxLength: 255
        date:
          type: string
          format: date
          nullable: true
        time:
          $ref: '#/components/schemas/TimeOfDay'
        endDate:
          description: Null with an endTime — the day it starts, or the next one when the end is earlier.
          type: string
          format: date
          nullable: true
        endTime:
          $ref: '#/components/schemas/TimeOfDay'
        slotDate:
          description: When the band itself plays (a festival over several days); with slotTime.
          type: string
          format: date
          nullable: true
        slotTime:
          $ref: '#/components/schemas/TimeOfDay'
        slotEndTime:
          $ref: '#/components/schemas/TimeOfDay'
        venue:
          description: Null or blank — not known yet (the gig is then known by its town).
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          nullable: true
          maxLength: 255
        country:
          allOf:
            - $ref: '#/components/schemas/CountryValue'
          nullable: true
        street:
          type: string
          nullable: true
          maxLength: 255
        postalCode:
          type: string
          nullable: true
          maxLength: 20
        district:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 100
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        lineup:
          description: The other bands.
          type: array
          items:
            type: string
            maxLength: 99
          maxItems: 20
        entry:
          $ref: '#/components/schemas/EntryTypeValue'
        price:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        facebookUrl:
          type: string
          nullable: true
          maxLength: 255
        ticketUrl:
          type: string
          nullable: true
          maxLength: 255
        posterUrl:
          type: string
          nullable: true
          maxLength: 255
        cancelled:
          type: boolean
    GigFormResponse: *gigForm
    TimeOfDay:
      description: '"HH:mm" or "HH:mm:ss".'
      type: string
      pattern: '^\d{2}:\d{2}(:\d{2})?$'
      nullable: true
