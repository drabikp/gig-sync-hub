openapi: 3.0.3
info:
  title: gigsynchub — import
  version: "1"
  description: |
    Bringing the band's existing gigs from the platforms into the catalog, linked to their
    platform events. Reading the platforms takes a while (a browser for some), so it runs in the
    background: POST /read starts it, the live update `import` tells when it ended, GET returns
    the plan; POST /apply imports what the user decided, naming the plan's proposals by index.
    One plan at a time, kept until applied or read again.
servers:
  - url: /
tags:
  - name: Import
paths:
  /api/bands/{bandId}/import:
    parameters:
      - $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/parameters/BandId'
    get:
      tags: [Import]
      operationId: importState
      responses:
        "200":
          description: What can be read, whether a read runs, and the plan when there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStateResponse'
  /api/bands/{bandId}/import/read:
    parameters:
      - $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/parameters/BandId'
    post:
      tags: [Import]
      operationId: readForImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportReadRequest'
      responses:
        "202":
          description: Reading (or a read already runs).
        "400":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/BadRequest'
        "409":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/Refused'
  /api/bands/{bandId}/import/apply:
    parameters:
      - $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/parameters/BandId'
    post:
      tags: [Import]
      operationId: applyImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportApplyRequest'
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultResponse'
        "400":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/BadRequest'
        "409":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/Refused'
components:
  schemas:
    ImportStateResponse:
      type: object
      required: [platforms, reading, readError, plan]
      properties:
        platforms:
          description: The platforms that can be read.
          type: array
          items:
            type: string
        reading:
          type: boolean
        readError:
          type: string
          nullable: true
        plan:
          allOf:
            - $ref: '#/components/schemas/ImportPlanResponse'
          nullable: true
    ImportPlanResponse:
      type: object
      required: [proposals, alreadyLinked, skipped, failures]
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ImportProposalResponse'
        alreadyLinked:
          type: integer
        skipped:
          type: array
          items:
            type: string
        failures:
          description: Per platform that couldn't be read, why.
          type: object
          additionalProperties:
            type: string
    ImportProposalResponse:
      description: |
        One gig to add or link. `versions` — the distinct details found, the catalog's first
        (platform null); `foundOn` — the platforms with a copy; `suggested` — matched to a
        catalog gig on the same day and town (the user confirms).
      type: object
      required: [index, date, inCatalog, suggested, hasConflict, foundOn, versions]
      properties:
        index:
          type: integer
        date:
          type: string
          format: date
        inCatalog:
          type: boolean
        suggested:
          type: boolean
        hasConflict:
          type: boolean
        foundOn:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ImportVersionResponse'
    ImportVersionResponse:
      type: object
      required: [platform, title, start, end, venue, city, cancelled]
      properties:
        platform:
          type: string
          nullable: true
        title:
          type: string
        start:
          description: Local date-time, e.g. 2026-10-17T20:30.
          type: string
        end:
          type: string
          nullable: true
        venue:
          type: string
          nullable: true
        city:
          type: string
        cancelled:
          type: boolean
    ImportReadRequest:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items:
            type: string
    ImportDecisionRequest:
      description: "`version` — the index into the proposal's versions whose details to keep."
      type: object
      required: [index, include, sameGig, version]
      properties:
        index:
          type: integer
        include:
          type: boolean
        sameGig:
          type: boolean
        version:
          type: integer
    ImportApplyRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ImportDecisionRequest'
    ImportResultResponse:
      type: object
      required: [added, updated, linked, skipped]
      properties:
        added:
          type: integer
        updated:
          type: integer
        linked:
          type: integer
        skipped:
          type: integer
