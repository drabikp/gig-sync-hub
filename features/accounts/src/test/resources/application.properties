# This module's persistence tests: PostgreSQL in Docker (Testcontainers' jdbc:tc: URL — one
# container per test run, kept while it runs). The schema comes from the Flyway migrations,
# so they are exercised by every test run.
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///gigsynchub?TC_DAEMON=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The same batching and id settings as production (see app/src/main/resources/application.properties),
# so the tests exercise how the app really writes rather than a row at a time.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
