# The app with its database, its sign-in (Rauthy) and daily backups:
#   docker/make-secrets.sh        (once: ./secrets from the git-ignored login files + random ones)
#   cp .env.example .env          (the band's and this machine's settings; git-ignored)
#   docker compose up -d --build  → https://$GSH_DOMAIN (default https://localhost) through Caddy:
#                                   /auth/* is Rauthy, the rest the app
# Secrets are files under ./secrets, given to the containers as Docker secrets (never
# environment variables); ./data holds the band's calendar profile and the backups,
# ./auth-data Rauthy's cache.
name: gigsynchub

# Every container's log is capped, because the default is not. Docker's json-file driver keeps
# writing until the disk is full, and the first thing a full disk stops is PostgreSQL — the one
# service whose failure is not recoverable by restarting it. Three files of 10 MB is a few days of
# this app's chatter and 30 MB a service at worst.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# What every container of ours gives up. None of them needs to add a capability, change its own
# privileges, or write outside its volumes — saying so costs nothing and takes a whole class of
# escape off the table. (`no-new-privileges` is what stops a setuid binary inside an image from
# mattering at all.)
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Whether a container comes back by itself. `unless-stopped` (the default here) is what a server
# wants: a crash or a daemon restart brings the stack back, while an explicit `docker compose stop`
# is remembered and stays stopped. A machine where this app is one project among several wants
# `GSH_RESTART=no` in its .env: then nothing starts until someone says `up`, and the stack never
# appears behind the next `docker` command that happens to wake the daemon.
x-restart: &restart ${GSH_RESTART:-unless-stopped}

services:
  db:
    image: postgres:18-alpine
    restart: *restart
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # No cap_drop here, deliberately, while every other service has one. PostgreSQL's image starts
    # as root to prepare and own the data directory and then drops to the postgres user itself, and
    # the exact set it needs for that is the image's business and changes with it. This is the one
    # container whose failure to start is not fixed by starting it again, and a capability list
    # that turns out to be one short is exactly that failure — a trade this app does not need to
    # make, since `no-new-privileges` already shuts the way that matters.

    # A database is stopped, never killed: ten seconds is not enough for a checkpoint on a busy
    # one, and what follows a kill is crash recovery on the next start.
    stop_grace_period: 2m
    mem_limit: ${GSH_DB_MEM:-2g}
    cpus: ${GSH_DB_CPUS:-2}
    environment:
      POSTGRES_DB: gigsynchub
      POSTGRES_USER: gigsynchub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Pinned to the value THIS image already uses — checked against the running container, not
      # assumed. The volume is mounted at /var/lib/postgresql and PostgreSQL 18's image keeps its
      # cluster in <major>/docker beneath it; a pin of the older /var/lib/postgresql/data would
      # have been an empty directory inside a full volume, which is an initdb and an empty
      # database on a machine that had one. The major version in the path is deliberate: bumping
      # the image to 19 then fails loudly here instead of quietly making a second cluster, and a
      # major upgrade is pg_upgrade or dump-and-restore, never a new tag.
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
    # only this machine: for running the app outside Docker during development
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gigsynchub", "-d", "gigsynchub"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        UID: ${GSH_UID:-1000}
        GID: ${GSH_GID:-1000}
    image: gigsynchub:latest
    restart: *restart
    logging: *logging
    <<: *hardening
    # The JVM gets its heap from the container's limit (-XX:MaxRAMPercentage=75 in the Dockerfile),
    # so this number is what the app may have, not a guess at what it will take.
    mem_limit: ${GSH_APP_MEM:-1g}
    cpus: ${GSH_APP_CPUS:-2}
    # Spring's graceful shutdown lets the request in flight finish; a sync step talking to a
    # platform is a few HTTP calls and wants longer than the default ten seconds to end tidily
    # (what it cannot finish is postponed, not lost — but a postponed create is a create nobody is
    # sure about).
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gigsynchub
      # the app signs in as gigsynchub_app (row-level security holds it, no superuser); the migrations as the owner
      SPRING_DATASOURCE_USERNAME: gigsynchub_app
      SPRING_FLYWAY_USER: gigsynchub
      # the sign-in: Rauthy as the browser sees it, and as the app reaches it inside the network
      GIGSYNCHUB_AUTH_ISSUER: https://${GSH_DOMAIN:-localhost}/auth/v1/
      GIGSYNCHUB_AUTH_INTERNALURL: http://rauthy:8080/auth/v1/
      # The operator's port, for the scraper to reach. Nothing publishes 8081, so this opens it to
      # the containers' network and to nothing else — the boundary the database is already behind.
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      # Traces are sent only when there is something to send them to: set GSH_OTLP_ENABLED=true in
      # .env when running the observability profile. Off, the spans are still made and their ids
      # are still in every log line, which is most of the value and costs nothing.
      GSH_OTLP_ENABLED: ${GSH_OTLP_ENABLED:-false}
      GSH_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      GSH_LOG_FILE: /app/data/logs/gigsynchub.json
    # each secret appears as /run/secrets/<property name>, read by spring.config.import=configtree
    secrets:
      - source: db_password
        target: spring.flyway.password
      - source: db_app_password
        target: spring.datasource.password
      - source: db_app_password
        target: gigsynchub.db.app-role-password
      - source: auth_client_secret
        target: gigsynchub.auth.client-secret
      # the key the bands' secrets (their platform accounts, calendar addresses) are sealed with
      - source: data_keys
        target: gigsynchub.accounts.data-keys
      # band #1's accounts and calendar from before each band connected its own: kept once in the
      # database on start, then unused (empty files are fine)
      - source: bandzone_login
        target: gigsynchub.bandzone.login
      - source: bandzone_password
        target: gigsynchub.bandzone.password
      - source: bandsintown_login
        target: gigsynchub.bandsintown.login
      - source: bandsintown_password
        target: gigsynchub.bandsintown.password
      - source: bandsintown_totp
        target: gigsynchub.bandsintown.totp-secret
      - source: calendar_url
        target: gigsynchub.calendar.ical-url
    volumes:
      - ./data:/app/data
    # this machine only (health, debugging): the way in for people is the proxy — signing in
    # needs https://$GSH_DOMAIN. GSH_APP_BIND=0.0.0.0 opens it to the local network.
    ports:
      - "${GSH_APP_BIND:-127.0.0.1}:8080:8080"
    # names on the internet (the platforms, the calendar, the town search): Docker's own forwarding
    # failed behind a VPN's name servers; container names (db) still resolve. GSH_DNS to change it.
    dns:
      - ${GSH_DNS:-1.1.1.1}

  # makes the `rauthy` database and role on db when they're missing (then exits)
  rauthy-db:
    image: postgres:18-alpine
    logging: *logging
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: gigsynchub
      PGDATABASE: gigsynchub
    secrets:
      - db_password
      - rauthy_db_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        pw="$$(cat /run/secrets/rauthy_db_password)"
        if [ "$$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'rauthy'")" != 1 ]; then
          # a variable (the password, quoted by psql) only works in what psql reads, not in -c
          echo "CREATE ROLE rauthy LOGIN PASSWORD :'pw'" | psql -v ON_ERROR_STOP=1 -q -v pw="$$pw"
          echo "made the role rauthy"
        fi
        if [ "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'rauthy'")" != 1 ]; then
          psql -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE rauthy OWNER rauthy"
          echo "made the database rauthy"
        fi

  # the sign-in: OpenID Connect for the app (docker/rauthy/config.toml), its users, groups and
  # passkeys; reached at https://$GSH_DOMAIN/auth/ through the proxy. The first admin's password
  # is in its log once, on the first start.
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_AUTH_MEM:-512m}
    cpus: ${GSH_AUTH_CPUS:-1}
    user: "${GSH_UID:-1000}:${GSH_GID:-1000}"
    # No healthcheck, and not for want of trying: this image is the binary and nothing else — no
    # shell, no wget — and the binary has no `health` command of its own (`rauthy --help`:
    # serve, bootstrap, generate-config, validate-config, generate-enc-key, generate-secrets,
    # hash-password). A check would have to be invented from outside the container, which is not
    # what a container healthcheck is. Whether signing in works is the proxy's `/auth/` route.
    depends_on:
      rauthy-db:
        condition: service_completed_successfully
    environment:
      PUB_URL: ${GSH_DOMAIN:-localhost}
      RP_ID: ${GSH_DOMAIN:-localhost}
      RP_ORIGIN: https://${GSH_DOMAIN:-localhost}:443
      TRUSTED_PROXIES: ${GSH_SUBNET:-10.201.0.0/24}
      BOOTSTRAP_ADMIN_EMAIL: ${GSH_ADMIN_EMAIL:-admin@localhost}
      # Rauthy's own default: its admin pages need a passkey. A machine that cannot make one yet
      # (GSH_ADMIN_MFA=false in its .env) gets in with the password alone — never on a public server.
      ADMIN_FORCE_MFA: ${GSH_ADMIN_MFA:-true}
      SECRETS_FILE: /run/secrets/rauthy_secrets
    secrets:
      - rauthy_secrets
    volumes:
      - ./docker/rauthy/config.toml:/app/config.toml:ro
      - ./secrets/rauthy-bootstrap:/app/bootstrap:ro
      - ./auth-data:/app/data
    dns:
      - ${GSH_DNS:-1.1.1.1}

  # the way in: HTTPS for GSH_DOMAIN (docker/Caddyfile) — /auth/* to Rauthy, the rest to the app
  proxy:
    image: caddy:2-alpine
    restart: *restart
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # Caddy binds 80 and 443, which is all it needs the capability for.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: ${GSH_PROXY_MEM:-256m}
    healthcheck:
      # Caddy's own admin API, which it serves on localhost:2019 inside the container. A GET
      # (-O /dev/null), not --spider: that sends a HEAD, which the admin API need not answer. By
      # address and not by name: localhost reaches ::1 first in this image and nothing answers there.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - app
      - rauthy
    environment:
      # the address the app is reached at (.env); localhost: a try with Caddy's own certificate
      GSH_DOMAIN: ${GSH_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # the certificates: kept, so a restart doesn't ask Let's Encrypt again
      - caddy-data:/data
      - caddy-config:/config

  # pg_dump on start and then daily into ./data/backups, the newest 14 kept
  backup:
    image: postgres:18-alpine
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_BACKUP_MEM:-256m}
    user: "${GSH_UID:-1000}:${GSH_GID:-1000}"
    # Not "is the container running" — that is the failure this is here to catch. The stamp is
    # written only when a WHOLE round came through, so a backup container that is up and failing
    # every dump goes unhealthy within a day and a half (docker/backup.sh, docs/disaster-recovery.md).
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/LAST_OK && test $$(find /backups/LAST_OK -mmin +2160 | wc -l) -eq 0"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: gigsynchub
      PGDATABASE: gigsynchub
      KEEP: 14
    secrets:
      - db_password
    volumes:
      - ./data/backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
      # not run by this service: `docker compose run --rm backup /restore.sh` uses it
      - ./docker/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  # --- Watching it: metrics, logs and traces, and one place to read them ---
  # None of these says `user:`, while app, rauthy and backup all do. The difference is what they
  # write to: those three write to BIND mounts this machine owns, so they have to be the host's
  # user; these write to NAMED volumes, which Docker creates with the ownership the IMAGE declares
  # — which is the only place that knows which uid the thing inside actually runs as. Setting it
  # by hand here gets a root-owned volume and a container that cannot write to it, which is a
  # crash loop with "permission denied" in a language nobody reads until they do.
  # Off unless asked for: `docker compose --profile observability up -d`. Around 900 MB all told,
  # which is why it is a choice and not a default. Grafana is on this machine only (127.0.0.1),
  # like every other operator's door in this file.
  #
  # Why not Elasticsearch: this is one app on one server, and the question is "what happened to
  # this request", not "search the text of a fleet's logs". Loki indexes labels and leaves the
  # lines alone, which costs a fifth of the memory, and the same Grafana then shows the metric,
  # the trace and the log line that go together.

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_PROMETHEUS_MEM:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # how long a number is kept; traces last a week, metrics a season
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.9
    profiles: [observability]
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_LOKI_MEM:-512m}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.9.0
    profiles: [observability]
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_TEMPO_MEM:-512m}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  # Reads the app's own log FILE — no Docker socket anywhere in this file. A container with the
  # socket can do whatever the daemon can, which is root on the host, and a stack for watching an
  # app should not be the largest hole in it. See docker/observability/alloy.alloy.
  # The one here that DOES say `user:`, for the same reason app and backup do: it reads a bind
  # mount this machine owns (the app's log file). Its own state goes to a bind mount too, at a
  # path of its own — /var/lib/alloy in the image is `drwxrwx--- 473:473`, and this image runs as
  # root, which with `cap_drop: ALL` is a root without DAC_OVERRIDE and so is held to the
  # permission bits like anybody else. One uid for both halves is simpler than two that must agree.
  alloy:
    image: grafana/alloy:v1.12.1
    profiles: [observability]
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_ALLOY_MEM:-256m}
    user: "${GSH_UID:-1000}:${GSH_GID:-1000}"
    command:
      - run
      - --storage.path=/alloy-data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - ./data/logs:/app-logs:ro
      - ./data/alloy:/alloy-data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.3.1
    profiles: [observability]
    restart: *restart
    logging: *logging
    <<: *hardening
    mem_limit: ${GSH_GRAFANA_MEM:-512m}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GSH_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      # this machine only, like the app's own port and the actuator: ssh -L if you want it elsewhere
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

secrets:
  db_password:
    file: ./secrets/db_password
  db_app_password:
    file: ./secrets/db_app_password
  auth_client_secret:
    file: ./secrets/auth_client_secret
  rauthy_secrets:
    file: ./secrets/rauthy.toml
  rauthy_db_password:
    file: ./secrets/rauthy_db_password
  data_keys:
    file: ./secrets/data_keys
  bandzone_login:
    file: ./secrets/bandzone_login
  bandzone_password:
    file: ./secrets/bandzone_password
  bandsintown_login:
    file: ./secrets/bandsintown_login
  bandsintown_password:
    file: ./secrets/bandsintown_password
  bandsintown_totp:
    file: ./secrets/bandsintown_totp
  calendar_url:
    file: ./secrets/calendar_url

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # the observability profile's; nothing else touches them, and removing them loses only history
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

# A fixed subnet: Docker's own pick (172.x) can collide with a VPN's routes, and the page then
# can't be reached from this machine. Change GSH_SUBNET if this one is taken.
networks:
  default:
    ipam:
      config:
        - subnet: ${GSH_SUBNET:-10.201.0.0/24}
